name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lite CLI
        uses: actions/checkout@v4
        with:
          path: awiki-lite-cli
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install, lint, typecheck, test, and build
        working-directory: awiki-lite-cli
        run: |
          uv sync --group dev
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest
          uv run pytest -m repo_contract tests/test_ts_wave1_contracts.py
          uv build

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lite CLI
        uses: actions/checkout@v4
        with:
          path: awiki-lite-cli
      - name: Set up Node 20.11
        uses: actions/setup-node@v4
        with:
          node-version: "20.11"
      - name: Set up pnpm 9.15
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Install, typecheck, test, and build Lite TypeScript
        working-directory: awiki-lite-cli/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
