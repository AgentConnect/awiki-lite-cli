[project]
name = "awiki-lite-cli"
version = "0.2.0"
description = "A deliberately small Python CLI for AWiki identity and messaging"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AgentConnect" }]
dependencies = [
    "anp==0.9.1",
    "cryptography>=45,<47",
    "httpx>=0.28,<1.0",
    "platformdirs>=4.3,<5.0",
    "typer>=0.16,<1.0",
]

[project.scripts]
awiki-lite = "awiki_lite_cli.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.uv.sources]
anp = { path = "../anp/anp", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awiki_lite_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["awiki_lite_cli"]
mypy_path = "src"
